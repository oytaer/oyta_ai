[package]
name = "oyta-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tensor core data structures for oyta-ai — DynamicShape, Strides, Device markers, safetensors I/O"
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["cpu"]
cpu    = []
cuda   = ["oyta-device/cuda"]         # 传递给 oyta-device
metal  = ["oyta-device/metal"]         # 传递给 oyta-device
wgpu   = ["oyta-device/wgpu"]          # 传递给 oyta-device
blas   = ["oyta-device/blas"]          # 传递给 oyta-device
memory_pool = ["oyta-device/memory_pool"]  # 传递给 oyta-device
debug_assertions = ["oyta-device/debug_assertions"]  # 传递给 oyta-device

[dependencies]
oyta-device = { version = "0.1.0", path = "../oyta-device" }
rayon       = { workspace = true }
rand        = { workspace = true }
rand_distr  = { workspace = true }
num-traits  = { workspace = true }   # Float trait bound
thiserror   = { workspace = true }
serde_json  = { workspace = true }   # safetensors JSON header 解析（Value 手动解析）
